<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrnel</title>
<style>

  :root {
    color-scheme: dark;
    --bg-1: #2b2142;
    --bg-2: #130f1f;
    --ink: #f6efe6;
    --ink-dim: #b8aec4;
    --accent: #ffb86b;
    --danger: #ff6b7a;
    --ok: #7ee0a1;
    --panel: rgba(255, 255, 255, 0.07);
    --panel-line: rgba(255, 255, 255, 0.14);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 20%, var(--bg-1), var(--bg-2));
    color: var(--ink);
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---- stage: cat + artefact ---- */

  #viewport {
    position: absolute; left: 16px; right: 16px; top: 72px; bottom: 150px;
    background: #0e0b16; border: 1px solid var(--panel-line); border-radius: var(--radius);
    overflow: hidden; display: none; z-index: 2; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  body.with-art #viewport { display: flex; flex-direction: column; }
  #vp-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--panel-line); font-size: 15px;
  }
  #vp-title { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vp-ver { color: var(--ink-dim); font-size: 13px; }
  #frame { flex: 1; width: 100%; border: 0; background: #fff0; }

  /* ---- chrome ---- */
  .chip {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; color: var(--ink-dim); backdrop-filter: blur(8px);
  }
  #topleft { position: fixed; left: 16px; top: 16px; display: flex; gap: 10px; align-items: center; z-index: 5; }
  #brand { font-weight: 800; color: var(--ink); letter-spacing: .02em; }
  #stateline { min-width: 8ch; }
  #offline { display: none; color: #ffd6a0; border-color: #ffb86b66; }
  body.offline #offline { display: inline-flex; }
  #conn { display: none; color: var(--danger); }
  body.disconnected #conn { display: inline-flex; }

  #topright { position: fixed; right: 16px; top: 16px; display: flex; gap: 10px; align-items: center; z-index: 5; }
  .btn {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px;
    min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: rgba(255,255,255,.13); }
  #mute { min-width: 56px; min-height: 56px; padding: 0 18px 0 14px; position: relative; }
  #mute .ring {
    position: absolute; left: 6px; top: 50%; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%;
    background: var(--ok); opacity: .0; transform: scale(1); transition: opacity .15s; z-index: -1;
  }
  #mute svg { width: 28px; height: 28px; flex: none; }
  #mute .slash { display: none; }
  body.muted #mute { border-color: #ff6b7a88; background: rgba(255,107,122,.14); }
  body.muted #mute .slash { display: block; }
  #mute-label { font-size: 14px; }

  #drawer {
    position: fixed; right: 16px; top: 84px; width: min(320px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
    background: rgba(24, 18, 38, .96); border: 1px solid var(--panel-line); border-radius: var(--radius);
    padding: 8px; display: none; z-index: 6; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  #drawer.open { display: block; }
  #drawer h2 { margin: 8px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); }
  #drawer button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 12px; padding: 12px; min-height: 44px; }
  #drawer button:hover { background: rgba(255,255,255,.1); }
  #drawer .meta { color: var(--ink-dim); font-size: 12px; }
  #drawer .empty { padding: 12px; color: var(--ink-dim); }

  /* ---- subtitles ---- */
  #speech {
    position: fixed; left: 0; right: 0; bottom: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 0 24px; pointer-events: none; z-index: 4; transition: padding .6s;
  }
  body.with-art #speech { padding-left: calc(min(24vh, 200px) + 40px); }
  #heard { font-size: 15px; color: var(--ink-dim); font-style: italic; opacity: 0; transition: opacity .5s; max-width: 70ch; text-align: center; }
  #caption {
    font-size: clamp(20px, 3.2vh, 34px); line-height: 1.3; font-weight: 700; text-align: center; max-width: 34ch;
    opacity: 0; transition: opacity .5s; text-shadow: 0 2px 18px rgba(0,0,0,.6);
  }
  #heard.show, #caption.show { opacity: 1; }

  /* ---- keyboard (secondary) ---- */
  #typebar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); z-index: 5; }
  #typebar input {
    width: 100%; min-height: 44px; border-radius: 999px; border: 1px solid var(--panel-line);
    background: rgba(255,255,255,.05); color: var(--ink); font: inherit; font-size: 15px; padding: 0 18px; opacity: .55; transition: opacity .2s, background .2s;
  }
  #typebar input::placeholder { color: var(--ink-dim); }
  #typebar input:focus { opacity: 1; background: rgba(255,255,255,.1); outline: 2px solid var(--accent); }
  body.with-art #typebar { left: calc(min(24vh, 200px) + 40px + 16px); transform: none; width: min(560px, calc(100vw - min(24vh, 200px) - 72px)); }

  /* ---- confirm + toast + camera flash ---- */
  #confirm {
    position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,5,16,.6); z-index: 20; backdrop-filter: blur(4px);
  }
  #confirm.open { display: grid; }
  #confirm .box { background: #211a33; border: 1px solid var(--panel-line); border-radius: 22px; padding: 28px; width: min(460px, calc(100vw - 32px)); text-align: center; }
  #confirm p { font-size: 20px; line-height: 1.4; margin: 0 0 22px; }
  #confirm .row { display: flex; gap: 12px; justify-content: center; }
  #confirm .btn { min-width: 120px; justify-content: center; min-height: 52px; font-weight: 700; }
  #confirm .yes { background: rgba(255,107,122,.2); border-color: #ff6b7a99; }
  #confirm small { display: block; margin-top: 14px; color: var(--ink-dim); }
  #toast {
    position: fixed; left: 50%; top: 20px; transform: translate(-50%, -80px); background: #2a2140; border: 1px solid var(--panel-line);
    border-radius: 999px; padding: 10px 18px; z-index: 30; transition: transform .3s; font-size: 14px;
  }
  #toast.show { transform: translate(-50%, 0); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .35s; }
  #flash.on { opacity: .55; transition: none; }

  @media (max-width: 640px) {
    #mute-label, #brand { display: none; }
    #viewport { top: 70px; bottom: 170px; }
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1d1630; }
  #stage { pointer-events: none; }
  #viewport { pointer-events: auto; }
  #catWorld { cursor: pointer; }
  #pip {
    position: fixed; left: 12px; bottom: 10px; width: min(24vh, 200px); display: none; z-index: 3; cursor: pointer;
  }
  body.with-art #pip { display: block; }
  #tvlabel { cursor: pointer; }
</style>
</head>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const AMP = calm ? 0.35 : 1;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const smooth = (t) => t * t * (3 - 2 * t);
const linear = (t) => t;

const DEF = {
  bodyX: 0, bodyY: 0, bodyRot: 0, squash: 1,
  headX: 0, headY: 0, headRot: 0,
  earL: 0, earR: 0,          // degrees outward (negative = perked in)
  tail1: 0, tail2: 0,
  armL: 0, armR: 0,          // shoulder rotation (see rig notes)
  lid: 0,                    // resting eyelid closure 0..1
  px: 0, py: 0, cross: 0, pscale: 1,
  mouth: 0, whisk: 0, happy: 0,
  dots: 0, zz: 0, hearts: 0, wifi: 0,
};
const RATE = { mouth: 28, lid: 14, happy: 14, squash: 9, bodyX: 6, bodyRot: 8, bodyY: 12, tail1: 14, tail2: 14, armL: 12, armR: 12, px: 16, py: 16 };
const P = { ...DEF };

const el = {};
['root','body','head','earL','earR','tail1','tail2','armL','armR','eyeL','eyeR','gazeL','gazeR','pupL','pupR',
 'lidL','lidR','sleepL','sleepR','arcL','arcR','mouthOpen','mouthShut','tongue','whiskL','whiskR','shadow',
 'fxDots','fxZ','fxWifi','z0','z1','z2','h0','h1','h2','blushL','blushR'].forEach(k => el[k] = $(k));

const sin = Math.sin, PI = Math.PI;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const twitch = (t, period) => { const ph = (t % period) / period; return ph < 0.035 ? sin(ph / 0.035 * PI) : 0; };

let catState = 'idle';
let emote = null;                 // { name, start, until }
let mic = 0;                      // mic level 0..1
let mouthIn = 0, mouthAt = -1e9;  // mouth level from harness audio
let sayUntil = 0;                 // fallback lip-flap window
let blinkAt = 2, blinkT = -1;
let lookUntil = 0;

function targetPose(t, now) {
  const T = { ...DEF };
  const s = sin;
  switch (catState) {
    case 'listening':
      T.squash = 1 + 0.01 * s(t * 1.8); T.headRot = 7 + 2 * s(t * 1.2); T.headY = 4 - mic * 7;
      T.earL = -9; T.earR = -9; T.pscale = 1.3; T.tail1 = 8 * s(t * 2); T.tail2 = 10 * s(t * 2 - 1);
      break;
    case 'thinking':
      T.headRot = -7; T.px = 11; T.py = -9; T.armR = 152; T.tail1 = 20 * s(t * 0.8); T.tail2 = 26 * s(t * 0.8 - 1);
      T.earL = 4; T.earR = -4; T.squash = 1 + 0.01 * s(t * 1.4); T.dots = 1;
      break;
    case 'talking': {
      const fresh = now - mouthAt < 250;
      const m = fresh ? clamp(mouthIn * 1.25, 0, 1) : (now < sayUntil ? 0.35 + 0.3 * s(t * 14) : 0);
      T.mouth = m; T.headRot = 3 * s(t * 3.1); T.headY = -m * 3; T.squash = 1 + 0.012 * s(t * 2);
      T.tail1 = 15 * s(t * 2.2); T.tail2 = 20 * s(t * 2.2 - 1); T.px = 4 * s(t * 0.8); T.whisk = 3 * s(t * 3);
      break;
    }
    case 'sleeping':
      T.lid = 1; T.headRot = 13; T.headY = 16; T.headX = -6; T.squash = 1 + 0.028 * s(t * 0.9);
      T.earL = 20; T.earR = 20; T.tail1 = -6 + 3 * s(t * 0.5); T.tail2 = -10; T.zz = 1;
      break;
    case 'bored': {
      T.pscale = 1.55; T.earL = 6; T.earR = 6;
      const p = Math.floor(t / 4.5) % 4;
      if (p === 0) { // chase the tail
        T.headRot = 22 * s(t * 5) * AMP; T.tail1 = 38 * s(t * 8); T.tail2 = 45 * s(t * 8 - 0.5);
        T.cross = 9; T.mouth = 0.3; T.bodyRot = 6 * s(t * 5) * AMP; T.earL = 10 * s(t * 7); T.earR = 10 * s(t * 7 + 1);
      } else if (p === 1) { // zoomies
        zoom(T, t);
      } else if (p === 2) { // derp and wave
        T.headRot = 26 * s(t * 1.5) * AMP; T.armL = 100 + 25 * s(t * 9); T.armR = -100 - 25 * s(t * 9 + 1);
        T.mouth = 0.4 + 0.2 * s(t * 4); T.cross = -7; T.tail1 = 25 * s(t * 5);
      } else { // wiggle
        T.squash = 1 + 0.1 * s(t * 9) * AMP; T.tail1 = 45 * s(t * 12); T.tail2 = 35 * s(t * 12 - 1);
        T.bodyRot = 5 * s(t * 9) * AMP; T.headRot = -12 * s(t * 4.5); T.py = -6; T.mouth = 0.25;
        T.armL = 20 * s(t * 6); T.armR = -20 * s(t * 6);
      }
      break;
    }

      T.lid = 0.5 + 0.2 * s(t * 0.6); T.headRot = 5 + 5 * s(t * 0.5); T.headY = 8; T.earL = 14; T.earR = 14;

/* ---- movement ---- */
async function walkX(target, { run = false } = {}) {
  const lim = PLACES[Cat.surface];
  target = clamp(target, lim.minX, lim.maxX);
  const dist = Math.abs(target - Cat.x);
  if (dist < 3) return;
  const x0 = Cat.x;
  Cat.face = Math.sign(target - x0);
  gait.mode = run ? 'run' : 'walk';
  try { await tw(dist / (run ? 560 : 200), (p) => { Cat.x = x0 + (target - x0) * p; }, linear); }
  finally { gait.mode = null; }
}

async function jumpTo(name, preferX) {
  const pl = PLACES[name];
  const x0 = Cat.x, y0 = Cat.y, y1 = pl.y;
  const tx = clamp(preferX ?? x0, pl.minX, pl.maxX);
  if (Math.abs(tx - x0) > 4) Cat.face = Math.sign(tx - x0);
  pose('crouch'); await wait(0.24);
  const rise = Math.max(0, y0 - y1), run = Math.abs(tx - x0);
  const H = 70 + rise * 0.4 + run * 0.08;
  const dur = clamp(0.5 + (rise + run) / 1100, 0.55, 1.0);
  pose('leap');
  let switched = false;
  await tw(dur, (p) => {
    Cat.x = lerp(x0, tx, p);
    Cat.y = lerp(y0, y1, p) - 4 * H * p * (1 - p);
    if (p > 0.55 && !switched) { switched = true; setSurface(name); }
  }, linear);
  Cat.x = tx; Cat.y = y1; setSurface(name);
  pose('land'); await wait(0.2);
  pose('stand'); await wait(0.12);
}

async function goFloor(x, opts) {
  await ensureSide();
  if (Cat.surface !== 'floor') await jumpTo('floor', Cat.x + Cat.face * 150);
  await walkX(x, opts);
}
async function goTo(name, run) {
  const x = PLACES[name] ? PLACES[name].floorX : 860;
  await goFloor(x, { run });
}
async function jumpOn(name, preferX) {
  if (!isFurniture(name)) return goTo(name, false);
  if (Cat.surface === name) return;
  await ensureSide();
  const pl = PLACES[name];
  if (Cat.surface !== 'floor' && Math.abs(Cat.x - clamp(Cat.x, pl.minX, pl.maxX)) > 430) {
    await jumpTo('floor', Cat.x + Cat.face * 120);
  }
  if (Cat.surface === 'floor' && Math.abs(Cat.x - pl.floorX) > 150) await walkX(pl.floorX + rnd(-40, 40));
  await jumpTo(name, preferX);
}

/* ---- turning between the front, side and curled-up bodies ---- */
function normalizeVis() { for (const k of ['front', 'side', 'sleep']) vis[k] = Cat.mode === k ? 1 : 0; }
async function setMode(m) {
  if (Cat.mode === m) return;
  const from = Cat.mode;
  try {
    await tw(0.1, (p) => { vis[from] = 1 - p; });
    Cat.mode = m;
    vis[from] = 0;
    await tw(0.14, (p) => { vis[m] = p; });
  } finally { normalizeVis(); }
}
async function ensureSide() {
  if (Cat.mode === 'side') return;
  if (Cat.mode === 'sleep') { await wakeUp(); return; }
  pose('sit');
  await setMode('side');
  pose('stand'); await wait(0.2);
}
async function faceFront() {
  if (Cat.mode === 'front') return;
  if (Cat.mode === 'sleep') await wakeUp();
  gait.mode = null;
  pose('sit'); await wait(0.35);
  await setMode('front');
}
async function wakeUp() {
  pose('loaf'); await setMode('side');
  pose('sit'); await wait(0.5);
  pose('bow'); await wait(0.9);
  ST.mouth = 0.9; await wait(0.6); ST.mouth = 0;
  pose('stand'); await wait(0.3);
}

/* ---- the things a cat does ---- */
const cup = { home: { x: 770, y: 700 }, out: false };
function placeFurball(x, y) {
  const f = $('furball');
  f.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  f.setAttribute('opacity', 1);
  clearTimeout(placeFurball.t);
  placeFurball.t = setTimeout(() => f.setAttribute('opacity', 0), 40000);
}
function setMug(x, y, rot) { $('mug').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})`); }
function resetMug() {
  cup.out = false;
  $('furnBehind').appendChild($('mug'));
  setMug(cup.home.x, cup.home.y, 0);
}

const ACTS = {
  async walk_to(t) { await goTo(t || 'rug', false); },
  async run_to(t) { await goTo(t || 'right', true); },
  async jump_on(t) { await jumpOn(t || 'sofa'); },
  async jump_down() {
    await ensureSide();
    if (Cat.surface !== 'floor') await jumpTo('floor', Cat.x + Cat.face * 140);
  },
  async sit() { await ensureSide(); pose('sit'); await wait(1.6); },
  async loaf() { await ensureSide(); pose('loaf'); await wait(3); },
  async stretch() {
    await ensureSide(); pose('bow'); await wait(1.1);
    ST.mouth = 0.9; await wait(0.9); ST.mouth = 0;
    pose('stand'); await wait(0.4);
  },
  async groom() {
    await ensureSide(); pose('sit'); await wait(0.5);
    for (let i = 0; i < 5; i++) { pose('groomA'); await wait(0.3); pose('groomB'); await wait(0.3); }
    pose('sit'); await wait(0.4);
  },
  async scratch(t) {
    const chair = t === 'armchair';
    await goFloor(chair ? 1224 : 640);
    Cat.face = chair ? 1 : -1;
    pose('scratch'); await wait(0.5);
    const mark = $('sofaScratches');
    for (let i = 0; i < 12; i++) {
      await tw(0.16, (p) => {
        const a = i % 2 ? p : 1 - p;
        ST.flU = -42 - 18 * a; ST.frU = -54 + 20 * a;
      });
      if (i === 6 && !chair) mark.setAttribute('opacity', 0.8);
    }
    pose('stand'); await wait(0.5);
  },
  async furball() {
    await ensureSide();
    pose('hunch'); await wait(0.7);
    for (let i = 0; i < 3; i++) {
      await tw(0.3, (p) => {
        const b = sin(p * PI);
        ST.neck = 44 + 16 * b; ST.nx = 12 * b; ST.bodyY = 16 + 7 * b; ST.mouth = b; ST.lid = 0.6 * b;
      });
    }
    ST.mouth = 0.8; await wait(0.3);
    placeFurball(Cat.x + Cat.face * 82, Cat.y);
    ST.mouth = 0; ST.lid = 0; ST.nx = 0;
    pose('sit'); await wait(0.7);
    for (let i = 0; i < 2; i++) { ST.neck = 52; await wait(0.25); ST.neck = 30; await wait(0.25); }
    pose('stand'); await wait(0.3);
    await walkX(Cat.x - Cat.face * 170);
  },
  async knock_cup() {
    if (cup.out) resetMug();
    await jumpOn('table', 720);
    await walkX(722);
    Cat.face = 1;
    pose('swat'); await wait(0.5);
    ST.t1 = 40; await wait(0.3);
    $('props').appendChild($('mug')); cup.out = true;
    await tw(0.18, (p) => { ST.flU = lerp(-68, -8, p); });
    const x0 = 770, y0 = 700;
    await tw(0.85, (p) => {
      setMug(x0 + 110 * p, y0 + (FLOOR - 8 - y0) * p * p, 560 * p);
    }, linear);
    setMug(880, FLOOR - 4, 92);
    pose('sit'); await wait(0.5);
    pose('stand');
    clearTimeout(knock_cup_t); knock_cup_t = setTimeout(resetMug, 25000);
    await jumpTo('floor', 840);
  },
  async chase_tail() {
    await ensureSide(); pose('sit'); await wait(0.3);
    for (let i = 0; i < 7; i++) {
      Cat.face *= -1;
      pose('sit', { neck: 20 + 30 * (i % 2), t1: 30, t2: 40 * (i % 2 ? 1 : -1), t3: 30, mouth: 0.4 });
      await wait(0.2);
    }
    pose('dizzy'); await wait(1.4);
    pose('stand');
  },
  async zoomies() {
    await ensureSide(); pose('stand');
    for (let i = 0; i < 4; i++) {
      await goFloor(rnd(120, 1480), { run: true });
      if (Math.random() < 0.45) {
        await jumpOn(pick(['sofa', 'armchair']));
        await jumpTo('floor', Cat.x + pick([-1, 1]) * rnd(150, 300));
      }
    }
    pose('sit', { mouth: 0.4 }); await wait(1.8); pose('stand');
  },
  async watch_tv() {
    await goFloor(760);
    Cat.face = 1;
    pose('watch'); await wait(0.5);
    tvFlicker = performance.now() + 7000;
    await wait(7);
    pose('stand');
  },
};
let knock_cup_t = 0, tvFlicker = 0;

/* ---- what she does when nobody is telling her ---- */
const ATTEND = new Set(['listening', 'thinking', 'talking', 'waiting']);
let busy = null;              // { commanded, state }
const queue = [];
let sleepPlace = 'sofa';

async function sleepRoutine() {
  busy = { commanded: false, state: 'sleeping' };
  if (Cat.mode !== 'sleep') {
    await ensureSide();
    if (sleepPlace === 'rug') await goFloor(860);
    else if (isFurniture(sleepPlace)) await jumpOn(sleepPlace, PLACES[sleepPlace].floorX);
    else await goFloor(PLACES[sleepPlace]?.floorX ?? 860);
    pose('loaf'); await wait(0.8);
    await setMode('sleep');
  }
  while (catState === 'sleeping') await wait(0.5);
}
async function tiredRoutine() {
  busy = { commanded: false, state: 'tired' };
  await ensureSide();
  await jumpOn('sofa');
  pose('sit'); await wait(0.8);
  while (catState === 'tired') {
    ST.lid = 0.55; ST.neck = 30; await wait(2.2);
    await tw(1.6, (p) => { ST.mouth = sin(p * PI); ST.neck = 30 + 22 * sin(p * PI); ST.lid = 0.55 + 0.35 * sin(p * PI); });
    ST.mouth = 0; await wait(rnd(2, 4));
  }
}
const MISCHIEF = [['zoomies', 3], ['scratch', 2], ['knock_cup', 1.5], ['chase_tail', 2], ['furball', 0.8], ['groom', 1], ['stretch', 1], ['jump_on', 1.5], ['watch_tv', 0.6]];
async function mischief() {
  busy = { commanded: false, state: 'bored' };
  let r = Math.random() * MISCHIEF.reduce((s, m) => s + m[1], 0), name = MISCHIEF[0][0];
  for (const [n, w] of MISCHIEF) { if ((r -= w) <= 0) { name = n; break; } }
  const target = name === 'jump_on' ? pick(['sofa', 'armchair', 'table', 'tv', 'window']) : name === 'scratch' ? pick(['sofa', 'armchair']) : undefined;
  await ensureSide();
  await ACTS[name](target);
  await wait(rnd(0.6, 2.2));
}

async function decide() {
  if (window.freeze) { await new Promise((r) => setTimeout(r, 100)); return; }
  normalizeVis();
  if (queue.length) {
    const job = queue.shift();
    busy = { commanded: true };
    try { await job(); } finally { busy = null; }
    return;
  }
  const st = catState;
  try {
    if (['idle', 'bored', 'tired'].includes(st) && birdsPerched().length && performance.now() > birdCooldown) await chatterAtBirds();
    else if (st === 'sleeping') await sleepRoutine();
    else if (st === 'tired') await tiredRoutine();
    else if (st === 'bored') await mischief();
    else { await faceFront(); await wait(0.25); }
  } finally { busy = null; }
}
(async function life() {
  for (;;) {
    try { await decide(); } catch (x) { if (x !== CANCEL) console.error(x); }
    await new Promise((r) => setTimeout(r, 30));
  }
})();

function onAct(actions) {
  if (busy && !busy.commanded) cancelAll();
  for (const a of actions) {
    if (!ACTS[a.do]) continue;
    queue.push(() => ACTS[a.do](a.target));
  }
}

/* =========================================================
   The window: your real time of day, a tree, and the odd bird
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const SKY = [
  [0, '#070d24', '#131f4a'], [5, '#0f1a44', '#2a3a7a'], [6, '#3a4a8a', '#f0a070'], [7, '#5a8fd0', '#f8c890'],
  [9, '#5aa8f0', '#bfe2ff'], [12, '#4a9cf2', '#cfeaff'], [16, '#5aa0e8', '#d8ecff'], [18, '#4a5aa0', '#f5a45a'],
  [19, '#2c3a78', '#e8805a'], [20, '#141f50', '#3a3068'], [21.5, '#0a1230', '#18255a'], [24, '#070d24', '#131f4a'],
];
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgbHex = (c) => '#' + c.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return rgbHex(A.map((v, i) => lerp(v, B[i], t))); };
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
    if (h >= h0 && h <= h1) { const f = (h - h0) / (h1 - h0); return [mixHex(t0, t1, f), mixHex(b0, b1, f)]; }
  }
  return [SKY[0][1], SKY[0][2]];
}
let hourOverride = null;
const hourNow = () => {
  if (hourOverride != null) return hourOverride;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
};
const daylightAt = (h) => (h < 5.5 || h >= 20.5 ? 0 : h < 7.5 ? (h - 5.5) / 2 : h < 17 ? 1 : 1 - (h - 17) / 3.5);
let daylight = 1;

function updateSky() {
  const h = hourNow(), [top, bot] = skyAt(h), d = clamp(daylightAt(h), 0, 1), n = 1 - d;
  daylight = d;
  $('skyTop').setAttribute('stop-color', top); $('skyBot').setAttribute('stop-color', bot);
  $('stars').setAttribute('opacity', clamp(n * 1.4 - 0.25, 0, 1).toFixed(2));
  // sun: rises on the left at 06:00, sets on the right at 18:00
  const st = clamp((h - 6) / 12, 0, 1), low = 1 - Math.sin(Math.PI * st), sunUp = h > 5.7 && h < 19.3;
  $('sunG').setAttribute('opacity', sunUp ? clamp(Math.min(h - 5.7, 19.3 - h) * 2, 0, 1).toFixed(2) : 0);
  $('sunG').setAttribute('transform', `translate(${(630 + 230 * st).toFixed(1)} ${(412 - 262 * Math.sin(Math.PI * st)).toFixed(1)})`);
  $('sun').setAttribute('fill', mixHex('#fff3c0', '#ff8f3a', low * low));
  $('sunGlow').setAttribute('fill', mixHex('#ffe9a8', '#ff7a2a', low * low));
  // moon: up from about 18:30 to 05:30, crossing right to left
  const mt = clamp(((h - 18.3 + 24) % 24) / 11.4, 0, 1), moonUp = h >= 18.3 || h < 5.7;
  $('moonG').setAttribute('opacity', moonUp ? clamp(n * 2, 0, 1).toFixed(2) : 0);
  $('moonG').setAttribute('transform', `translate(${(860 - 230 * mt).toFixed(1)} ${(405 - 250 * Math.sin(Math.PI * mt)).toFixed(1)})`);
  // the land, the tree and the clouds follow the light
  $('hills').setAttribute('fill', mixHex('#10202a', '#4f9a5a', d));
  $('limbs').setAttribute('stroke', mixHex('#1e150e', '#6b4a2e', d));
  $('leaves').setAttribute('fill', mixHex('#0f2b2b', '#3f9b4f', d));
  $('leavesHi').setAttribute('fill', mixHex('#143a38', '#56b565', d));
  $('clouds').setAttribute('fill', mixHex('#7d88b8', '#ffffff', clamp(d * 1.2, 0, 1)));
  $('clouds').setAttribute('opacity', (0.12 + 0.8 * d).toFixed(2));
  // the room: dark and lamplit at night, warm at dawn and dusk
  const warm = d > 0.03 && d < 0.97 ? Math.max(0, 1 - Math.abs(d - 0.5) * 2.2) : 0;
  $('ambNight').setAttribute('opacity', (0.34 * n).toFixed(3));
  $('ambWarm').setAttribute('opacity', (0.13 * warm).toFixed(3));
  $('lampGlow').setAttribute('opacity', (0.25 + 0.75 * n).toFixed(2));
}
updateSky();
setInterval(updateSky, 20000);

/* ---- birds: a sparrow, a blue tit or a robin drops in now and then ---- */
const BIRD_KINDS = [
  { body: '#8b5e3c', belly: '#e6cfa8', wing: '#6a4426', head: '#7a5232', beak: '#e8a43a' },   // sparrow
  { body: '#6aa0d8', belly: '#f5d95a', wing: '#3f6fb0', head: '#2f4f8a', beak: '#333333' },   // blue tit
  { body: '#8a6a4a', belly: '#ee7a3a', wing: '#6a4a30', head: '#8a6a4a', beak: '#333333' },   // robin
];
const PERCHES = [{ x: 812, y: 304 }, { x: 781, y: 293 }, { x: 735, y: 276 }];
const birds = [];
const birdLayer = $('birds');
let nextBirdAt = 12;          // seconds on the page clock
let birdWatching = false, birdCooldown = 0;

function birdMarkup(c) {
  return `<path d="M-8 -12 L-25 -6 L-24 -14Z" fill="${c.wing}"/>
    <ellipse cx="0" cy="-13" rx="11" ry="8" fill="${c.body}"/><ellipse cx="2" cy="-10" rx="7" ry="5" fill="${c.belly}"/>
    <circle cx="9" cy="-19" r="5.8" fill="${c.head}"/><path d="M13.5 -19.8 L19.5 -18.4 L13.5 -17Z" fill="${c.beak}"/>
    <circle cx="11" cy="-20.5" r="1.2" fill="#111"/>
    <g class="bw"><ellipse cx="-2" cy="-14" rx="8" ry="4.6" fill="${c.wing}"/></g>
    <path class="legs" d="M-2 -6 V0 M3 -6 V0" stroke="#5a4030" stroke-width="1.4"/>`;
}
function makeBird() {
  const free = PERCHES.filter((p) => !birds.some((b) => b.perch === p));
  if (!free.length) return;
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = birdMarkup(pick(BIRD_KINDS));
  birdLayer.appendChild(g);
  const fromLeft = Math.random() < 0.5;
  birds.push({
    g, wing: g.querySelector('.bw'), legs: g.querySelector('.legs'), perch: pick(free), state: 'in', t: 0,
    dur: rnd(1.3, 1.9), stay: rnd(8, 15), x0: fromLeft ? 590 : 900, y0: rnd(140, 210), face: 1, turn: rnd(1, 3), seed: Math.random() * 6,
  });
}
function spawnBirds() {
  makeBird();
  if (Math.random() < 0.4) setTimeout(makeBird, 900);
}
const birdsPerched = () => birds.filter((b) => b.state === 'perch');

function onBirdPerched() {
  // a bored or tired cat drops what she's doing to go and look; a busy or sleepy one doesn't notice
  if (busy && !busy.commanded && ['bored', 'tired'].includes(busy.state)) cancelAll();
}

function birdsStep(t, dt) {
  if (!document.hidden && daylight > 0.3 && !birds.length && t > nextBirdAt) spawnBirds();
  for (const b of [...birds]) {
    b.t += dt;
    let x, y, flap = false, tilt = 0, face = b.face;
    if (b.state === 'in') {
      const p = clamp(b.t / b.dur, 0, 1), e = smooth(p);
      x = lerp(b.x0, b.perch.x, e); y = lerp(b.y0, b.perch.y, e) - 26 * sin(p * PI) * (1 - p);
      flap = true; face = Math.sign(b.perch.x - b.x0) || 1; b.face = face;
      if (p >= 1) { b.state = 'perch'; b.t = 0; onBirdPerched(b); }
    } else if (b.state === 'perch') {
      x = b.perch.x; y = b.perch.y;
      b.turn -= dt;
      if (b.turn <= 0) { b.face = -b.face; b.turn = rnd(1.2, 3.5); }
      face = b.face; tilt = 3 * sin(t * 5 + b.seed);
      if (sin(t * 2.6 + b.seed) > 0.985) y -= 3;                 // a little hop
      if (b.t > b.stay) { b.state = 'out'; b.t = 0; b.x1 = x; b.y1 = y; b.tx = b.x1 > 750 ? 600 : 900; }
    } else {
      const p = clamp(b.t / 1.7, 0, 1);
      x = lerp(b.x1, b.tx, p * p); y = b.y1 - 130 * p - 14 * sin(p * PI); flap = true;
      face = Math.sign(b.tx - b.x1) || 1; b.face = face;
      if (p >= 1) { b.g.remove(); birds.splice(birds.indexOf(b), 1); if (!birds.length) nextBirdAt = t + rnd(35, 90); continue; }
    }
    b.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${face} 1) rotate(${tilt.toFixed(1)})`);
    b.wing.setAttribute('transform', `rotate(${flap ? (-58 * Math.abs(sin(t * 34 + b.seed))).toFixed(1) : 0} -2 -14)`);
    b.legs.setAttribute('opacity', flap ? 0 : 1);
  }
}

/* Cats chatter at birds: she hops on the windowsill, stares and makes the 'ek-ek-ek' noise. */
async function chatterAtBirds() {
  busy = { commanded: false, state: catState };
  birdWatching = true;
  try {
    await ensureSide();
    await jumpOn('window', 690);
    Cat.face = 1;
    pose('sit', { neck: 24, px: 10, py: -8 });
    await wait(0.6);
    for (let burst = 0; burst < 4 && birdsPerched().length; burst++) {
      send({ type: 'sfx', kind: 'chatter' });
      await tw(1.3, (p) => {
        ST.mouth = 0.12 + 0.2 * Math.abs(sin(p * 70)); ST.t3 = -4 + 14 * sin(p * 40);
        ST.neck = 24 + 2 * sin(p * 50); ST.ear = 6 * Math.abs(sin(p * 20));
      }, linear);
      ST.mouth = 0; ST.ear = 0;
      const b = birdsPerched()[0];
      if (b) ST.py = clamp((b.perch.y - 285) / 5, -10, 4);
      await wait(rnd(0.7, 1.5));
    }
    ST.px = 12; ST.py = -10; await wait(1.5);   // watch it fly away
    pose('sit'); await wait(1.2);
  } finally {
    birdWatching = false;
    birdCooldown = performance.now() + 25000;
  }
}

function skyStep(t) {
  const x1 = ((t * 4) % 380) + 570, x2 = ((t * 2.6 + 190) % 380) + 570;
  $('cloud1').setAttribute('transform', `translate(${x1.toFixed(1)} 186)`);
  $('cloud2').setAttribute('transform', `translate(${x2.toFixed(1)} 238)`);
}

/* =========================================================
   Frame loop
   ========================================================= */
let last = performance.now();
function frame(ms) {
  try {
    const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
    const t = ms / 1000;
    stepTweens(dt);
    frontRender(t, ms, dt);
    // blink shared by the side rig
    let blink = 0;
    if (blinkT >= 0) blink = sin(clamp((t - blinkT) / 0.16, 0, 1) * PI);
    sideRender(t, ms, dt, blink);
    if (Cat.mode === 'sleep' || vis.sleep > 0.01) sleepRender(t);
    skyStep(t); birdsStep(t, dt);
    place();
    updateCamera(dt);
    // TV: flickers while she watches, otherwise glows softly when there's an artefact on it
    const g = $('tvGlow');
    if (ms < tvFlicker) { g.setAttribute('opacity', (0.25 + 0.2 * sin(t * 9) * sin(t * 3.1)).toFixed(2)); g.setAttribute('fill', ['#7ee0a1', '#8fb8ff', '#ffb86b'][Math.floor(t * 2.2) % 3]); }
    else g.setAttribute('opacity', lastArt ? 0.12 : 0);
  } catch (e) {
    console.error('frame error', e);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =========================================================
   UI wiring
   ========================================================= */
const LABELS = { idle: 'ready', listening: 'listening…', thinking: 'thinking…', talking: 'talking', sleeping: 'zzz…', bored: 'bored!', tired: 'sleepy…', waiting: 'waiting…' };
let awake = false, muted = false, current = null, captionTimer = 0, heardTimer = 0, working = false;

function setState(s) {
  const prev = catState;
  catState = s;
  refreshLabel();
  if (prev !== s) onState(prev, s);
}
/* An autonomous routine (wandering, napping) ends as soon as the state it belongs to ends. */
function onState(prev, next) {
  if (prev === 'sleeping') sleepPlace = 'sofa';
  if (busy && !busy.commanded && busy.state && busy.state !== next) cancelAll();
}
let lastArt = null;
function refreshLabel() {
  $('stateline').textContent = !awake ? 'waking up…' : muted ? 'muted' : (LABELS[catState] || catState);
}
function setMuted(m) {
  muted = m;
  document.body.classList.toggle('muted', m);
  $('mute').setAttribute('aria-pressed', String(m));
  $('mute-label').textContent = m ? 'Muted' : 'Listening';
  $('mute').title = m ? 'Unmute microphone and camera (M)' : 'Mute microphone and camera (M)';
  setState(catState);
  if (m) { $('ring').style.opacity = 0; }
}
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
function showCaption(text) {
  const c = $('caption'); c.textContent = text; c.classList.add('show');
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => c.classList.remove('show'), 3500 + text.length * 60);
  sayUntil = performance.now() + Math.max(1200, text.length * 62);
}
function showHeard(text) {
  const h = $('heard'); h.textContent = '“' + text + '”'; h.classList.add('show');
  clearTimeout(heardTimer); heardTimer = setTimeout(() => h.classList.remove('show'), 5000);
}
function startEmote(name, secs) {
  const now = performance.now();
  emote = { name, start: now, until: now + secs * 1000 };
}

/* ---- artefact viewport ---- */
const PRELUDE = `<script>window.purrnel={_r:0,_p:{},get(k){return new Promise(res=>{const r=++this._r;this._p[r]=res;parent.postMessage({purrnel:1,op:'get',key:k,req:r},'*')})},set(k,v){parent.postMessage({purrnel:1,op:'set',key:k,value:v},'*');return Promise.resolve()}};addEventListener('message',e=>{const d=e.data;if(d&&d.purrnelReply){const f=window.purrnel._p[d.req];if(f){delete window.purrnel._p[d.req];f(d.value)}}});<\/script>`;
function withPrelude(html) {
  const head = /<head[^>]*>/i, htmlTag = /<html[^>]*>/i;
  if (head.test(html)) return html.replace(head, (m) => m + PRELUDE);
  if (htmlTag.test(html)) return html.replace(htmlTag, (m) => m + '<head>' + PRELUDE + '</head>');
  return '<!doctype html><html><head><meta charset="utf-8">' + PRELUDE + '</head><body>' + html + '</body></html>';
}
function showArtefact(a) {
  current = a.id;
  working = false;
  $('vp-title').textContent = a.title;
  $('vp-ver').textContent = a.version > 1 ? `version ${a.version}` : '';
  $('frame').srcdoc = withPrelude(a.html);
  document.body.classList.add('with-art');
  if (emote && emote.name === 'working') emote = null;
  lastArt = { id: a.id, title: a.title };
  $('tvTitle').textContent = a.title.length > 22 ? a.title.slice(0, 21) + '…' : a.title;
  $('tvTitle').setAttribute('opacity', 1); $('tvPlay').setAttribute('opacity', 0.7);
}
function closeArtefact() {
  current = null;
  document.body.classList.remove('with-art');
  $('frame').srcdoc = '';
}
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.purrnel || e.source !== $('frame').contentWindow || !current) return;
  if (d.op === 'get') send({ type: 'data_get', id: current, req: d.req, key: String(d.key) });
  else if (d.op === 'set') send({ type: 'data_set', id: current, key: String(d.key), value: d.value });
});

function renderDrawer(items) {
  $('art-count').textContent = items.length;
  const list = $('drawer-list'); list.textContent = '';
  if (!items.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nothing yet. Ask me to make something!'; list.append(d); return; }
  for (const it of items) {
    const b = document.createElement('button');
    const t = document.createElement('div'); t.textContent = it.title;
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = `${it.versions} version${it.versions === 1 ? '' : 's'} · ${new Date(it.updated * 1000).toLocaleString()}`;
    b.append(t, m);
    b.onclick = () => { send({ type: 'show', id: it.id }); toggleDrawer(false); };
    list.append(b);
  }
}
function toggleDrawer(open) {
  const d = $('drawer'); const o = open ?? !d.classList.contains('open');
  d.classList.toggle('open', o); $('artefacts-btn').setAttribute('aria-expanded', String(o));
}

/* ---- websocket ---- */
let ws;
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => document.body.classList.remove('disconnected');
  ws.onclose = () => { document.body.classList.add('disconnected'); setTimeout(connect, 1500); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
function handle(m) {
  switch (m.type) {
    case 'cat': setState(m.state); break;
    case 'privacy': setMuted(m.muted); break;
    case 'online': document.body.classList.toggle('offline', !m.online); break;
    case 'heard': showHeard(m.text); break;
    case 'say': showCaption(m.text); break;
    case 'mouth': mouthIn = m.level; mouthAt = performance.now(); break;
    case 'level': {
      mic = m.level;
      const r = $('ring'); r.style.opacity = muted ? 0 : (0.15 + mic * 0.6).toFixed(2); r.style.transform = `scale(${(1 + mic * 0.8).toFixed(2)})`;
      break;
    }
    case 'artefact': showArtefact(m); break;
    case 'artefacts': renderDrawer(m.items); break;
    case 'close': closeArtefact(); break;
    case 'ready':
      awake = true; refreshLabel();
      if (!m.voice) toast('No voice available: I can only show subtitles.');
      else if (!m.ears) toast('No speech recognition: please type to me.');
      break;
    case 'confirm': $('confirm-text').textContent = m.prompt; $('confirm').classList.add('open'); $('confirm-yes').focus(); break;
    case 'confirm_done': $('confirm').classList.remove('open'); break;
    case 'emote':
      startEmote(m.name, m.name === 'working' ? 20 : (m.name === 'yawn' || m.name === 'sleepy' ? 2.6 : 4));
      if (Cat.mode !== 'front' && !busy && !queue.length) queue.push(() => faceFront());
      break;
    case 'act': onAct(m.actions); break;
    case 'sleep': sleepPlace = m.place; break;
    case 'looking': {
      lookUntil = performance.now() + 1400;
      const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
      break;
    }
    case 'notice': toast(m.text); break;
    case 'data_reply': {
      if (m.id === current) $('frame').contentWindow?.postMessage({ purrnelReply: 1, req: m.req, value: m.value }, '*');
      break;
    }
  }
}

/* ---- controls ---- */
$('mute').onclick = () => send({ type: 'toggle_mute' });
$('vp-close').onclick = () => send({ type: 'close' });
$('artefacts-btn').onclick = () => toggleDrawer();
$('confirm-yes').onclick = () => send({ type: 'confirm_answer', yes: true });
$('confirm-no').onclick = () => send({ type: 'confirm_answer', yes: false });
$('typebar').onsubmit = (e) => {
  e.preventDefault();
  const i = $('type'); const text = i.value.trim();
  if (text) send({ type: 'text', text });
  i.value = '';
};
addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') { toggleDrawer(false); $('type').blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('type').focus(); }
  else if (e.key.toLowerCase() === 'm') send({ type: 'toggle_mute' });
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#drawer') && !e.target.closest('#artefacts-btn')) toggleDrawer(false);
});

const pet = () => send({ type: 'pet' });
catWorld.addEventListener('click', pet);
$('pip').addEventListener('click', pet);
$('tvlabel').addEventListener('click', () => { if (lastArt) send({ type: 'show', id: lastArt.id }); });

/* Debug handle for poking the room from the console, e.g. room.act('scratch') */
window.room = { Cat, ACTS, queue, pose, onAct, spawnBirds, birds, setHour: (h) => { hourOverride = h; updateSky(); }, setSleep: (p) => { sleepPlace = p; }, get state() { return catState; }, setState };
setMuted(false);
connect();

</script>
</body>
