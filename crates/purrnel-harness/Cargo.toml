[package]
name = "purrnel-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
purrnel-core = { path = "../purrnel-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
